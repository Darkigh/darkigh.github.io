<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Survey</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .form-header {
      background-color: #4a148c;
      color: white;
      padding: 22px 28px;
      text-align: center;
    }

    .form-header h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .form-header p {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    form {
      padding: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #333;
    }

    input[type="text"],
    input[type="email"],
    textarea,
    select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.92rem;
      font-family: Arial, sans-serif;
      background: #fafafa;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #4a148c;
      background: #fff;
    }

    textarea {
      resize: vertical;
    }

    /* Fieldset styling */
    fieldset {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 14px 18px;
      margin-bottom: 20px;
      background: #fafafa;
    }

    legend {
      font-weight: bold;
      font-size: 0.9rem;
      color: #4a148c;
      padding: 0 8px;
    }

    .radio-group label,
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      font-size: 0.92rem;
      margin-bottom: 8px;
      cursor: pointer;
      color: #333;
    }

    .radio-group label:last-child,
    .checkbox-group label:last-child {
      margin-bottom: 0;
    }

    input[type="radio"],
    input[type="checkbox"] {
      accent-color: #4a148c;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    select {
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      padding: 10px 28px;
      font-size: 0.92rem;
      font-family: Arial, sans-serif;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button[type="submit"] {
      background-color: #4a148c;
      color: white;
      flex: 1;
    }

    button[type="submit"]:hover { background-color: #38006b; }

    button[type="reset"] {
      background-color: #e0e0e0;
      color: #333;
      flex: 1;
    }

    button[type="reset"]:hover { background-color: #bdbdbd; }

    footer {
      text-align: center;
      font-size: 0.78rem;
      color: #999;
      padding: 14px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="form-header">
    <h1>🎵 Music Survey</h1>
    <p>Tell us about your music preferences!</p>
  </div>

  <form action="form9.php" method="post">

    <!-- Name -->
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" />
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email">E-mail Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your e-mail address" />
    </div>

    <!-- Scrolling Text Box -->
    <div class="form-group">
      <label for="comments">Comments / Favorite Songs</label>
      <textarea id="comments" name="comments" cols="60" rows="3"
        placeholder="Tell us about your favorite songs or artists..."></textarea>
    </div>

    <!-- Radio Button Group -->
    <fieldset>
      <legend>How often do you listen to music?</legend>
      <div class="radio-group">
        <label><input type="radio" name="frequency" value="daily" /> Every day</label>
        <label><input type="radio" name="frequency" value="few_times" /> A few times a week</label>
        <label><input type="radio" name="frequency" value="weekends" /> Only on weekends</label>
        <label><input type="radio" name="frequency" value="rarely" /> Rarely</label>
      </div>
    </fieldset>

    <!-- Checkbox Group -->
    <fieldset>
      <legend>Favorite Music Genres (select all that apply)</legend>
      <div class="checkbox-group">
        <label><input type="checkbox" name="genre" value="pop" /> Pop</label>
        <label><input type="checkbox" name="genre" value="hiphop" /> Hip-Hop / Rap</label>
        <label><input type="checkbox" name="genre" value="rock" /> Rock</label>
        <label><input type="checkbox" name="genre" value="rnb" /> R&amp;B / Soul</label>
        <label><input type="checkbox" name="genre" value="classical" /> Classical</label>
      </div>
    </fieldset>

    <!-- Select Box -->
    <div class="form-group">
      <label for="platform">Preferred Music Streaming Platform</label>
      <select id="platform" name="platform" size="3">
        <option value="">-- Select a platform --</option>
        <option value="spotify">Spotify</option>
        <option value="apple_music">Apple Music</option>
        <option value="youtube">YouTube Music</option>
        <option value="soundcloud">SoundCloud</option>
        <option value="tidal">Tidal</option>
      </select>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
      <button type="submit">Submit Survey</button>
      <button type="reset">Reset Form</button>
    </div>

  </form>

  <footer>
    ECC006 — Homework Assignment #9 &nbsp;|&nbsp; Taha Saeed Taha Mohamed
  </footer>

</div>

</body>
</html>
